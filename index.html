<title>CleanFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1EC; --bg2:#E5EAE2; --surface:#FFFFFF;
    --ink:#222A25; --muted:#6E776E; --line:#DCE2D8;
    --sage:#45795B; --sage-deep:#34604598; --sage-deep:#356045; --sage-soft:#DBEADF;
    --coral:#EE8C53; --coral-soft:#FBE5D5; --gold:#E0A93F;
    --shadow:0 2px 4px rgba(40,60,48,.04), 0 8px 24px rgba(40,60,48,.06);
    --shadow-lg:0 8px 18px rgba(40,60,48,.08), 0 24px 56px rgba(40,60,48,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);
    line-height:1.5; min-height:100vh; overflow-x:hidden;
    background-image:radial-gradient(circle at 12% -8%, #F3F6F0 0%, transparent 42%),
                     radial-gradient(circle at 92% 4%, #EAF0E8 0%, transparent 38%);
    background-attachment:fixed;
  }
  .wrap{max-width:560px; margin:0 auto; padding:20px 16px 120px;}
  .mono{font-family:'Space Mono',monospace;}
  .display{font-family:'Bricolage Grotesque',sans-serif; letter-spacing:-.02em;}

  /* ---- Top bar ---- */
  .topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px;}
  .greet{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:26px; letter-spacing:-.025em; line-height:1.1;}
  .sub{color:var(--muted); font-size:13.5px; margin-top:3px;}
  .stat-pills{display:flex; gap:8px; flex-shrink:0;}
  .pill{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:7px 11px; text-align:center; box-shadow:var(--shadow); min-width:58px;}
  .pill .n{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:19px; line-height:1; display:flex; align-items:center; justify-content:center; gap:3px;}
  .pill .l{font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-top:3px;}
  .pill.streak .n{color:var(--gold);}
  .pill.points .n{color:var(--sage);}

  /* ---- Daily ring summary ---- */
  .daycard{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px; box-shadow:var(--shadow); display:flex; align-items:center; gap:18px; margin-bottom:16px;}
  .countbadge{width:84px; height:84px; border-radius:50%; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 32%, #ECF4EE, #DAEADF); border:1px solid var(--sage-soft);}
  .countbadge b{font-family:'Bricolage Grotesque',sans-serif; font-size:36px; line-height:1; color:var(--sage-deep);}
  .countbadge span{font-size:8.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-top:4px;}
  .daytext h3{margin:0; font-family:'Bricolage Grotesque',sans-serif; font-size:17px; font-weight:700;}
  .daytext p{margin:4px 0 0; color:var(--muted); font-size:13px;}

  /* ---- Mode toggle ---- */
  .modeswitch{display:flex; background:var(--bg2); border-radius:16px; padding:4px; margin-bottom:18px; position:relative;}
  .modeswitch button{flex:1; border:none; background:transparent; font-family:'Inter',sans-serif; font-weight:600; font-size:14px; color:var(--muted); padding:11px; border-radius:12px; cursor:pointer; transition:color .2s; z-index:1;}
  .modeswitch button.active{color:var(--sage-deep);}
  .modeswitch .glider{position:absolute; top:4px; bottom:4px; width:calc(50% - 4px); background:var(--surface); border-radius:12px; box-shadow:var(--shadow); transition:transform .28s cubic-bezier(.5,.05,.2,1);}

  /* ---- FOCUS card (the hero) ---- */
  #focusView{animation:fade .35s ease;}
  .focuscard{background:var(--surface); border:1px solid var(--line); border-radius:28px; box-shadow:var(--shadow-lg); padding:26px 22px 22px; text-align:center; position:relative; overflow:hidden;}
  .focuscard::before{content:''; position:absolute; top:0; left:0; right:0; height:6px; background:linear-gradient(90deg,var(--sage),#6BA888);}
  .areachip{display:inline-flex; align-items:center; gap:6px; background:var(--sage-soft); color:var(--sage-deep); font-weight:600; font-size:12.5px; padding:6px 12px; border-radius:999px; margin-bottom:18px;}
  .task-title{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:30px; letter-spacing:-.03em; line-height:1.12; margin:0 0 8px; min-height:40px;}
  .task-est{color:var(--muted); font-size:14px; margin-bottom:20px;}
  .task-est b{color:var(--ink); font-weight:600;}

  /* timer */
  .timerwrap{position:relative; width:172px; height:172px; margin:6px auto 16px;}
  .timerwrap .time{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .timerwrap .time .t{font-family:'Space Mono',monospace; font-weight:700; font-size:38px; letter-spacing:-.02em; color:var(--ink);}
  .timerwrap .time .state{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin-top:2px;}
  .presets{display:flex; justify-content:center; gap:7px; margin-bottom:16px; flex-wrap:wrap;}
  .preset{border:1px solid var(--line); background:var(--surface); color:var(--muted); font-family:'Space Mono',monospace; font-size:12.5px; padding:6px 11px; border-radius:10px; cursor:pointer; transition:.15s;}
  .preset.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .timerbtns{display:flex; justify-content:center; gap:10px; margin-bottom:6px;}
  .tbtn{border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.15s;}
  .tbtn:active{transform:scale(.96);}

  /* main actions */
  .actions{display:flex; flex-direction:column; gap:10px; margin-top:22px;}
  .btn-done{background:var(--sage); color:#fff; border:none; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:18px; letter-spacing:-.01em; padding:17px; border-radius:18px; cursor:pointer; box-shadow:0 6px 16px rgba(69,121,91,.32); transition:.15s; display:flex; align-items:center; justify-content:center; gap:9px;}
  .btn-done:hover{background:var(--sage-deep);}
  .btn-done:active{transform:scale(.98);}
  .minor-row{display:flex; gap:10px;}
  .btn-minor{flex:1; background:transparent; border:1px solid var(--line); color:var(--muted); font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; padding:12px; border-radius:14px; cursor:pointer; transition:.15s;}
  .btn-minor:hover{border-color:var(--sage); color:var(--sage-deep);}
  .btn-minor:active{transform:scale(.97);}

  .scope-note{text-align:center; font-size:12.5px; color:var(--muted); margin:16px 0 0;}
  .scope-note button{background:none; border:none; color:var(--sage-deep); font-weight:600; cursor:pointer; text-decoration:underline; font-size:12.5px; padding:0;}

  /* break-it-down panel */
  .breakdown{margin-top:16px; text-align:left; background:var(--bg2); border-radius:16px; padding:14px 16px; animation:fade .25s;}
  .breakdown h4{margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);}
  .micro{display:flex; align-items:center; gap:10px; padding:7px 0; font-size:15px; cursor:pointer;}
  .micro .box{width:22px; height:22px; border:2px solid var(--line); border-radius:7px; flex-shrink:0; transition:.15s; position:relative;}
  .micro.checked .box{background:var(--sage); border-color:var(--sage);}
  .micro.checked .box::after{content:'✓'; color:#fff; font-size:14px; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700;}
  .micro.checked span{color:var(--muted); text-decoration:line-through;}

  /* all-done empty state */
  .alldone{text-align:center; padding:46px 20px; background:var(--surface); border:1px solid var(--line); border-radius:28px; box-shadow:var(--shadow);}
  .alldone .em{font-size:54px; margin-bottom:10px;}
  .alldone h2{font-family:'Bricolage Grotesque',sans-serif; font-size:26px; margin:0 0 8px; letter-spacing:-.02em;}
  .alldone p{color:var(--muted); margin:0 auto; max-width:300px; font-size:14.5px;}

  /* ---- OVERVIEW ---- */
  #overviewView{animation:fade .35s ease;}
  .area{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); cursor:pointer; transition:.15s;}
  .area:hover{box-shadow:var(--shadow-lg); transform:translateY(-1px);}
  .area:active{transform:scale(.99);}
  .area-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .area-name{display:flex; align-items:center; gap:11px; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px;}
  .area-emoji{font-size:22px;}
  .area-count{font-size:12.5px; color:var(--muted); font-family:'Space Mono',monospace; flex-shrink:0;}
  .progress{height:9px; background:var(--bg2); border-radius:999px; margin-top:13px; overflow:hidden;}
  .progress .fill{height:100%; background:linear-gradient(90deg,var(--sage),#6BA888); border-radius:999px; transition:width .5s cubic-bezier(.4,0,.2,1); width:0;}
  .area.complete .fill{background:linear-gradient(90deg,var(--gold),#EBC069);}
  .area-tasks{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); display:none;}
  .area.open .area-tasks{display:block; animation:fade .25s;}
  .trow{display:flex; align-items:center; gap:11px; padding:8px 2px; font-size:14.5px;}
  .trow .box{width:21px; height:21px; border:2px solid var(--line); border-radius:7px; flex-shrink:0; cursor:pointer; transition:.15s; position:relative;}
  .trow.done .box{background:var(--sage); border-color:var(--sage);}
  .trow.done .box::after{content:'✓'; color:#fff; font-size:13px; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700;}
  .trow.done .tname{color:var(--muted); text-decoration:line-through;}
  .tname{flex:1; cursor:pointer;}
  .tmin{font-family:'Space Mono',monospace; font-size:12px; color:var(--muted); flex-shrink:0;}
  .trow .del{opacity:0; border:none; background:none; color:var(--muted); cursor:pointer; font-size:16px; padding:0 4px; transition:.15s;}
  .trow:hover .del{opacity:.6;}
  .addtask{display:flex; gap:8px; margin-top:10px;}
  .addtask input{flex:1; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-family:'Inter',sans-serif; font-size:13.5px; outline:none;}
  .addtask input:focus{border-color:var(--sage);}
  .addtask button{border:none; background:var(--sage-soft); color:var(--sage-deep); font-weight:600; border-radius:10px; padding:0 14px; cursor:pointer; font-size:13.5px;}
  .area-actions{display:flex; gap:8px; margin-top:10px;}
  .area-actions button{background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; padding:4px 0;}
  .area-actions button:hover{color:var(--coral);}
  .focusone{margin-top:11px; width:100%; background:var(--ink); color:#fff; border:none; border-radius:13px; padding:12px; font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer;}

  .addarea{width:100%; border:2px dashed var(--line); background:transparent; color:var(--muted); border-radius:18px; padding:15px; font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer; transition:.15s; margin-top:4px;}
  .addarea:hover{border-color:var(--sage); color:var(--sage-deep);}

  .footer-tip{text-align:center; color:var(--muted); font-size:11.5px; margin-top:24px; line-height:1.6;}

  /* ---- Sunday Reset card ---- */
  .resetcard{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:15px 16px; box-shadow:var(--shadow); margin-bottom:16px; position:relative; overflow:hidden;}
  .resetcard.sunday{background:linear-gradient(135deg,#FFF8F2,#FFFFFF); border-color:var(--coral-soft); box-shadow:0 6px 20px rgba(238,140,83,.14);}
  .resetcard.done{background:linear-gradient(135deg,#F6FBF7,#FFFFFF); border-color:var(--sage-soft);}
  .resetcard-row{display:flex; align-items:center; gap:13px;}
  .reset-ic{width:42px; height:42px; border-radius:13px; background:var(--coral-soft); display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0;}
  .resetcard.done .reset-ic{background:var(--sage-soft);}
  .reset-badge{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:16px; letter-spacing:-.01em;}
  .resetcard.sunday .reset-badge{color:var(--coral);}
  .reset-sub{color:var(--muted); font-size:12.5px; margin-top:2px; line-height:1.4;}
  .reset-bar{height:7px; background:var(--bg2); border-radius:999px; margin:13px 0; overflow:hidden;}
  .reset-fill{height:100%; background:linear-gradient(90deg,var(--coral),#F4A878); border-radius:999px; transition:width .5s cubic-bezier(.4,0,.2,1);}
  .resetcard.done .reset-fill{background:linear-gradient(90deg,var(--sage),#6BA888);}
  .reset-cta{width:100%; border:none; border-radius:13px; padding:12px; font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer; color:#fff; background:var(--ink); transition:.15s;}
  .resetcard.sunday .reset-cta{background:var(--coral); box-shadow:0 4px 12px rgba(238,140,83,.3);}
  .reset-cta:active{transform:scale(.98);}

  .section-label{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:600; margin:4px 2px 12px;}
  .reset-area{border-color:var(--coral-soft);}
  .reset-area .fill{background:linear-gradient(90deg,var(--coral),#F4A878);}
  .reset-area.complete .fill{background:linear-gradient(90deg,var(--sage),#6BA888);}

  /* ---- Monthly Deep Clean (calm blue accent) ---- */
  .deepcard{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:15px 16px; box-shadow:var(--shadow); margin-bottom:16px; position:relative; overflow:hidden;}
  .deepcard.due{background:linear-gradient(135deg,#F3F6FB,#FFFFFF); border-color:#D9E2EF; box-shadow:0 6px 20px rgba(94,124,154,.13);}
  .deepcard.done{background:linear-gradient(135deg,#F6FBF7,#FFFFFF); border-color:var(--sage-soft);}
  .deep-ic{width:42px; height:42px; border-radius:13px; background:#E4EAF1; display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0;}
  .deepcard.done .deep-ic{background:var(--sage-soft);}
  .deep-fill{height:100%; background:linear-gradient(90deg,#5E7C9A,#88A4C1); border-radius:999px; transition:width .5s cubic-bezier(.4,0,.2,1);}
  .deepcard.done .deep-fill{background:linear-gradient(90deg,var(--sage),#6BA888);}
  .deepcard.due .reset-badge{color:#4E6B86;}
  .deep-cta{width:100%; border:none; border-radius:13px; padding:12px; font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer; color:#fff; background:var(--ink); transition:.15s;}
  .deepcard.due .deep-cta{background:#5E7C9A; box-shadow:0 4px 12px rgba(94,124,154,.28);}
  .deep-cta:active{transform:scale(.98);}
  .deep-area{border-color:#D9E2EF;}
  .deep-area .fill{background:linear-gradient(90deg,#5E7C9A,#88A4C1);}
  .deep-area.complete .fill{background:linear-gradient(90deg,var(--sage),#6BA888);}

  /* ---- Generic routine cards (accent set inline per card) ---- */
  .routinecard{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:15px 16px; box-shadow:var(--shadow); margin-bottom:14px; position:relative; overflow:hidden;}
  .routinecard.hot{background:linear-gradient(135deg,var(--accent-bg),#FFFFFF); border-color:var(--accent-soft); box-shadow:0 6px 20px rgba(40,60,48,.10);}
  .routinecard.done{background:linear-gradient(135deg,#F6FBF7,#FFFFFF); border-color:var(--sage-soft);}
  .routine-row{display:flex; align-items:center; gap:13px;}
  .routine-ic{width:42px; height:42px; border-radius:13px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0;}
  .routinecard.done .routine-ic{background:var(--sage-soft);}
  .routine-badge{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:16px; letter-spacing:-.01em;}
  .routinecard.hot .routine-badge{color:var(--accent);}
  .routine-sub{color:var(--muted); font-size:12.5px; margin-top:2px; line-height:1.4;}
  .routine-bar{height:7px; background:var(--bg2); border-radius:999px; margin:13px 0; overflow:hidden;}
  .routine-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-lite)); border-radius:999px; transition:width .5s cubic-bezier(.4,0,.2,1);}
  .routinecard.done .routine-fill{background:linear-gradient(90deg,var(--sage),#6BA888);}
  .routine-actions{display:flex; gap:9px; align-items:stretch;}
  .routine-cta{flex:1; border:none; border-radius:13px; padding:12px; font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer; color:#fff; background:var(--ink); transition:.15s;}
  .routinecard.hot .routine-cta{background:var(--accent); box-shadow:0 4px 12px rgba(40,60,48,.14);}
  .routine-cta:active{transform:scale(.98);}
  .routine-finish{border:1px solid var(--line); background:var(--surface); color:var(--muted); font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; padding:0 14px; border-radius:12px; cursor:pointer; white-space:nowrap; transition:.15s;}
  .routine-finish:hover{border-color:var(--sage); color:var(--sage-deep);}
  .routine-finish:active{transform:scale(.97);}

  /* ---- Deep Cleans collapsible group ---- */
  .deepgroup{margin-bottom:16px;}
  .deepgroup-head{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; cursor:pointer; box-shadow:var(--shadow); font-family:'Inter',sans-serif; transition:.15s;}
  .deepgroup-head:active{transform:scale(.99);}
  .deepgroup-head.spaced{margin-bottom:12px;}
  .dg-title{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:16px; color:var(--ink);}
  .dg-right{display:flex; align-items:center; gap:10px;}
  .dg-chip{font-size:11.5px; font-weight:600; color:var(--muted); background:var(--bg2); padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .dg-chip.hot{color:#8A5A2B; background:#F6E7D3;}
  .dg-chev{color:var(--muted); font-size:12px; width:12px; text-align:center;}
  .dg-more{width:100%; border:1px dashed var(--line); background:transparent; color:var(--muted); font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; padding:11px; border-radius:12px; cursor:pointer; transition:.15s;}
  .dg-more:hover{border-color:var(--sage); color:var(--sage-deep);}
  .dg-more:active{transform:scale(.98);}

  /* ---- Backfill (retroactive logging) ---- */
  .bf-link{background:none; border:none; padding:6px 0 0; margin:0; color:var(--sage-deep); font-family:'Inter',sans-serif; font-weight:600; font-size:12px; cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
  .backfill{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; box-shadow:var(--shadow); margin:-4px 0 16px; animation:fade .25s;}
  .backfill h4{margin:0 0 6px; font-family:'Bricolage Grotesque',sans-serif; font-size:15px; font-weight:700;}
  .bf-note{margin:0 0 12px; color:var(--muted); font-size:12px; line-height:1.5;}
  .bf-row{display:flex; align-items:center; gap:11px; padding:8px 2px; font-size:14px; cursor:pointer; border-bottom:1px solid var(--bg2);}
  .bf-row:last-of-type{border-bottom:none;}
  .bf-row .box{width:21px; height:21px; border:2px solid var(--line); border-radius:7px; flex-shrink:0; position:relative; transition:.15s;}
  .bf-row.on .box{background:var(--gold); border-color:var(--gold);}
  .bf-row.on .box::after{content:'✓'; color:#fff; font-size:13px; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700;}
  .bf-row span{flex:1;}
  .bf-row em{font-style:normal; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--gold); font-weight:700;}
  .bf-close{width:100%; margin-top:12px; border:none; background:var(--ink); color:#fff; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; padding:11px; border-radius:12px; cursor:pointer;}

  /* ---- Today's Five ---- */
  .fivecard{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:15px 16px; box-shadow:var(--shadow); margin-bottom:16px;}
  .fivecard.done{background:linear-gradient(135deg,#F6FBF7,#FFFFFF); border-color:var(--sage-soft);}
  .five-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .five-title{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:16px;}
  .five-count{font-family:'Space Mono',monospace; font-size:12px; color:var(--muted);}
  .five-list{margin-bottom:12px;}
  .five-row{display:flex; align-items:center; gap:10px; padding:7px 0; font-size:14px; border-bottom:1px solid var(--bg2);}
  .five-row:last-child{border-bottom:none;}
  .five-row .box{width:20px; height:20px; border:2px solid var(--line); border-radius:6px; flex-shrink:0; cursor:pointer; position:relative; transition:.15s;}
  .five-row.done .box{background:var(--sage); border-color:var(--sage);}
  .five-row.done .box::after{content:'✓'; color:#fff; font-size:12px; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700;}
  .five-name{flex:1; cursor:pointer;}
  .five-row.done .five-name{color:var(--muted); text-decoration:line-through;}
  .five-area{font-size:14px; flex-shrink:0; opacity:.8;}
  .five-actions{display:flex; gap:9px;}
  .five-go{flex:1; border:none; background:var(--sage); color:#fff; font-family:'Inter',sans-serif; font-weight:600; font-size:14px; padding:12px; border-radius:13px; cursor:pointer; box-shadow:0 4px 12px rgba(69,121,91,.24);}
  .fivecard.done .five-go{background:var(--muted); box-shadow:none;}
  .five-go:active{transform:scale(.98);}
  .five-shuffle{border:1px solid var(--line); background:var(--surface); color:var(--muted); font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; padding:0 14px; border-radius:12px; cursor:pointer; white-space:nowrap; transition:.15s;}
  .five-shuffle:hover{border-color:var(--sage); color:var(--sage-deep);}
  .five-shuffle:active{transform:scale(.97);}

  /* editable minute chips */
  .tmin.edit{cursor:pointer; border-bottom:1px dashed var(--line); padding-bottom:1px;}
  .tmin.edit:hover{color:var(--sage-deep); border-color:var(--sage);}
  .est-edit{cursor:pointer; border-bottom:1px dashed var(--line);}
  .est-edit:hover{color:var(--sage-deep); border-color:var(--sage);}

  /* daily / weekly chip on room tasks */
  .freq{flex-shrink:0; border:1px solid var(--line); background:transparent; color:var(--muted); font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; padding:3px 7px; border-radius:999px; cursor:pointer; white-space:nowrap;}
  .freq.daily{background:#FBF1DC; border-color:#F0DDB2; color:#8A6420;}
  .freq:active{transform:scale(.95);}

  /* Monday recap */
  .recap{background:linear-gradient(135deg,#FFF9EC,#FFFFFF); border:1px solid #F0DDB2; border-radius:22px; padding:16px; box-shadow:0 6px 20px rgba(224,169,63,.14); margin-bottom:16px; animation:fade .35s;}
  .recap-top{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .recap-ic{font-size:26px;}
  .recap-title{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px; letter-spacing:-.01em;}
  .recap-sub{color:var(--muted); font-size:12px;}
  .recap-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px;}
  .recap-stats div{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 6px; text-align:center;}
  .recap-stats b{display:block; font-family:'Bricolage Grotesque',sans-serif; font-size:22px; line-height:1.1; color:var(--ink);}
  .recap-stats span{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  .recap-rooms{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .recap-rooms span{font-size:12px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px 9px; font-family:'Space Mono',monospace;}
  .recap-note{font-size:12.5px; color:var(--muted); margin-bottom:12px;}
  .recap-go{width:100%; border:none; background:var(--gold); color:#fff; font-family:'Inter',sans-serif; font-weight:600; font-size:14px; padding:12px; border-radius:13px; cursor:pointer;}
  .recap-go:active{transform:scale(.98);}

  /* backup & restore */
  .backupbox{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:15px 16px; box-shadow:var(--shadow);}
  .backupbox p{margin:0 0 8px; font-size:13px; color:var(--muted); line-height:1.5;}
  .backup-last{font-size:12px; font-weight:600; color:var(--ink); margin-bottom:12px;}
  .backup-btns{display:flex; gap:9px;}
  .backup-save,.backup-load{flex:1; border-radius:12px; padding:11px; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer;}
  .backup-save{border:none; background:var(--ink); color:#fff;}
  .backup-load{border:1px solid var(--line); background:var(--surface); color:var(--ink);}

  /* confetti canvas */
  #confetti{position:fixed; inset:0; pointer-events:none; z-index:50;}

  /* toast */
  #toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(120px); background:var(--ink); color:#fff; padding:13px 20px; border-radius:14px; font-weight:600; font-size:14px; box-shadow:var(--shadow-lg); z-index:60; transition:transform .4s cubic-bezier(.2,.8,.2,1); display:flex; align-items:center; gap:9px; max-width:90vw;}
  #toast.show{transform:translateX(-50%) translateY(0);}
  #toast .em{font-size:18px;}

  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.06);}100%{transform:scale(1);}}
  .pop{animation:pop .4s ease;}

  .hidden{display:none !important;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="greet" id="greet">Let's tidy up</div>
      <div class="sub" id="subgreet">One small thing at a time.</div>
    </div>
    <div class="stat-pills">
      <div class="pill streak"><div class="n" id="streakN">0🌱</div><div class="l">streak</div></div>
      <div class="pill points"><div class="n" id="pointsN">0</div><div class="l">points</div></div>
    </div>
  </div>

  <div id="recapCard"></div>

  <div class="daycard">
    <div class="countbadge"><b id="dayCount">0</b><span>done today</span></div>
    <div class="daytext">
      <h3 id="dayHead">Fresh start</h3>
      <p id="daySub">Nothing done yet — and that's totally fine. Pick a tiny win below.</p>
      <button class="bf-link" onclick="toggleBackfill()">Forgot to log a day?</button>
    </div>
  </div>
  <div id="backfillPanel"></div>

  <div id="fiveCard"></div>

  <div id="resetCard"></div>
  <div id="deepGroup"></div>

    <div class="glider" id="glider"></div>
    <button id="mFocus" class="active" onclick="setMode('focus')">Focus</button>
    <button id="mOverview" onclick="setMode('overview')">Overview</button>
  </div>

  <!-- FOCUS -->
  <div id="focusView"></div>

  <!-- OVERVIEW -->
  <div id="overviewView" class="hidden"></div>

  <div class="footer-tip">CleanFlow saves your progress on this phone automatically.<br>No streak pressure — even one task counts as a win. 🌱</div>
</div>

<canvas id="confetti"></canvas>
<div id="toast"><span class="em">🎉</span><span id="toastMsg"></span></div>

<script>
/* ============ STORAGE SHIM ============ */
const Store = {
  mem:null,
  async get(){
    // 1) Claude artifact storage (only present inside Claude)
    try{ if(window.storage){ const r=await window.storage.get('cleanflow_state'); if(r) return JSON.parse(r.value); } }catch(e){}
    // 2) browser localStorage (used when installed to the home screen)
    try{ const v=localStorage.getItem('cleanflow_state'); if(v) return JSON.parse(v); }catch(e){}
    // 3) in-memory fallback
    return this.mem;
  },
  async set(v){
    this.mem=v;
    try{ if(window.storage){ await window.storage.set('cleanflow_state', JSON.stringify(v)); } }catch(e){}
    try{ localStorage.setItem('cleanflow_state', JSON.stringify(v)); }catch(e){}
  }
};

/* ============ DEFAULT DATA ============ */
function defaultAreas(){
  return [
    {id:'kit', name:'Kitchen', emoji:'🍳', tasks:[
      t('Clear & wipe counters',10), td('Load or run dishwasher',8), t('Wipe the stovetop',5), t('Trash & recycling out',4), t('Sweep the floor',7)
    ]},
    {id:'dine', name:'Dining Room / Entryway', emoji:'🍽️', tasks:[
      t('Clear the table',5), t('Sort the mail / drop-zone',5), t('Shoes lined up, coats hung',4), t('Wipe the table',3), t('Quick floor pickup',5)
    ]},
    {id:'liv', name:'Living Room', emoji:'🛋️', tasks:[
      t('Clear flat surfaces',8), t('Tidy & fluff cushions',3), t('Dust the surfaces',7), t('Vacuum or sweep',10)
    ]},
    {id:'gbath', name:'Guest Bathroom', emoji:'🧼', tasks:[
      t('Wipe sink & mirror',5), t('Scrub the toilet',6), t('Fresh hand towel',2), t('Empty the bin',2)
    ]},
    {id:'off', name:'Office', emoji:'🪑', tasks:[
      t('Clear off the desk',8), t('Toss or file papers',10), t('Tidy cables & cups',4), t('Empty the bin',2)
    ]},
    {id:'bed', name:'Main Bedroom', emoji:'🛏️', tasks:[
      td('Make the bed',3), t('Clear the nightstand',4), t('Put away stray clothes',10), t('Quick floor pickup',5)
    ]},
    {id:'mbath', name:'Main Bathroom', emoji:'🚿', tasks:[
      t('Wipe sink & mirror',5), t('Scrub the toilet',6), t('Rinse down the shower',8), t('Swap in fresh towels',2), t('Empty the bin',2)

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function sundayKey(){ const d=new Date(); d.setDate(d.getDate()-d.getDay()); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function upcomingSunday(){ const d=new Date(); const diff=(7-d.getDay())%7; d.setDate(d.getDate()+diff); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function mondayKey(){ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function monthKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1); }
function quarterKey(){ const d=new Date(); return d.getFullYear()+'-Q'+(Math.floor(d.getMonth()/3)+1); }
function halfKey(){ const d=new Date(); return d.getFullYear()+'-H'+(d.getMonth()<6?1:2); }
function parseKey(k){ const p=String(k).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function keyOf(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function daysSince(str){ if(!str) return null; const a=parseKey(str), b=parseKey(todayStr()); const n=Math.round((b-a)/86400000); return isFinite(n)?n:null; }

/* ============ ROUTINE REGISTRY ============ */
const LISTS = {

function routineHot(scope){ const d=new Date(), dow=d.getDay(), dom=d.getDate(), m=d.getMonth(); if(scope==='reset')return dow===0; if(scope==='deep')return dom>=15; if(scope==='quarter')return (m%3)===2; if(scope==='half')return (m%6)>=4; return false; }

async function init(){
  const saved = await Store.get();
  if(saved && saved.areas){
    S = saved;
    if(!S.reset){ S.reset = defaultReset(); S.lastReset=null; }
    if(S.resetFor===undefined){ S.resetFor = (typeof S.resetWeek==='string')?S.resetWeek:upcomingSunday(); delete S.resetWeek; }
    if(!S.deep){ S.deep = defaultDeep(); S.deepMonth = monthKey(); S.lastDeep=null; }
    if(!S.quarter){ S.quarter = defaultQuarter(); S.quarterPeriod = quarterKey(); S.lastQuarter=null; }
    if(!S.half){ S.half = defaultHalf(); S.halfPeriod = halfKey(); S.lastHalf=null; }
    if(S.todayCount==null) S.todayCount=0;
    // migrate old counter-based streak into a real log of active days
    if(!Array.isArray(S.activeDays)){
      S.activeDays=[];
      if(S.lastActiveDay && S.streak>0){
        const base=parseKey(S.lastActiveDay);
        for(let i=0;i<S.streak;i++){ const d=new Date(base); d.setDate(d.getDate()-i);
          S.activeDays.push(d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()); }
      }
    }
  } else {
    S = { areas:defaultAreas(), reset:defaultReset(), deep:defaultDeep(), quarter:defaultQuarter(), half:defaultHalf(),
      streak:0, points:0, lastDay:todayStr(), activeDays:[],
      resetFor:upcomingSunday(), lastReset:null, deepMonth:monthKey(), lastDeep:null,
      quarterPeriod:quarterKey(), lastQuarter:null, halfPeriod:halfKey(), lastHalf:null, todayCount:0 };
  }
  // keep only the last ~120 days of history
  if(S.activeDays.length>140) S.activeDays=S.activeDays.slice(-140);
  refreshStreak();
  // per-day completion history (feeds the Monday recap)
  if(!S.history){ S.history={}; if(S.lastDay && S.todayCount) S.history[S.lastDay]=S.todayCount; }
  pruneHistory();
  // room tasks are sticky all week and start fresh Monday morning
  if(S.roomWeek===undefined) S.roomWeek = mondayKey();   // existing users: keep this week's progress
  if(S.roomWeek !== mondayKey()){
    buildRecap(S.roomWeek);
    S.areas.forEach(a=>a.tasks.forEach(tk=>tk.done=false));
    S.roomWeek = mondayKey();
    S.five = null;
  }
  // daily: the "done today" tally, Today's Five, and any tasks tagged daily
  if(S.lastDay !== todayStr()){
    S.areas.forEach(a=>a.tasks.forEach(tk=>{ if(tk.daily) tk.done=false; }));
    S.lastDay = todayStr();
    S.todayCount = 0;
    S.five = null;
  }
  if(!S.five || S.five.day!==todayStr()) rollFive(true);
  // routine rollovers: Sunday Reset clears the day after Sunday; others clear each period
  LIST_ORDER.forEach(scope=>{
    const cfg=LISTS[scope], now=cfg.periodFn();
    if(S[cfg.periodField]!==now){ listArr(scope).forEach(tk=>tk.done=false); S[cfg.periodField]=now; }
  });
  await save();
  render();
}

function allTasks(){ let r=[]; S.areas.forEach(a=>a.tasks.forEach(tk=>r.push({area:a, task:tk}))); return r; }

/* ---- Today's Five ---- */
function rollFive(silent){
  // only pull from what's still left this week
  const source=allTasks().filter(x=>!x.task.done);
  // on a shuffle, steer away from the set you just saw
  const prev=new Set(!silent && S.five && S.five.ids ? S.five.ids.map(r=>r.taskId) : []);
  // Smarter Five: rooms (and tasks) you haven't touched lately float to the top,
  // with a little randomness so it never feels like the same list.
  const NEVER=21;
  const taskAge=tk=>{ const d=daysSince(tk.lastDone); return d==null?NEVER:Math.min(d,NEVER); };
  const taskScore=tk=>taskAge(tk)+Math.random()*3-(prev.has(tk.id)?50:0);
  const byArea={};
  source.forEach(x=>{ (byArea[x.area.id]=byArea[x.area.id]||[]).push(x); });
  const areaScore=id=>{
    const a=S.areas.find(z=>z.id===id);
    const age=Math.min(...a.tasks.map(taskAge));          // days since this room was last touched
    return age+Math.random()*4;
  };
  const areaIds=Object.keys(byArea).map(id=>({id,s:areaScore(id)})).sort((p,q)=>q.s-p.s).map(o=>o.id);
  let picks=[];
  areaIds.forEach(id=>{
    if(picks.length>=5) return;
    const best=byArea[id].map(x=>({x,s:taskScore(x.task)})).sort((p,q)=>q.s-p.s)[0];
    picks.push(best.x);
  });
  if(picks.length<5){
    const rest=source.filter(x=>!picks.some(p=>p.task.id===x.task.id))
      .map(x=>({x,s:taskScore(x.task)})).sort((p,q)=>q.s-p.s).map(o=>o.x);
    picks=picks.concat(rest.slice(0,5-picks.length));
  }
  S.five={ day:todayStr(), ids:picks.map(x=>({areaId:x.area.id, taskId:x.task.id})) };
  if(!silent){
    if(!focusScope || focusScope==='five'){ currentTask=null; skipped=[]; breakdownOpen=false; }
    save(); render();
    toast(picks.length?'Fresh five picked 🎲':'Every room task is done this week! ✨','🎲');
  }
}
function fiveTasks(){
  if(!S.five||!S.five.ids) return [];
  return S.five.ids.map(r=>findTask(r.areaId,r.taskId)).filter(Boolean);
}
function doneCount(){ return allTasks().filter(x=>x.task.done).length; }
function totalCount(){ return allTasks().length; }
function areaProgress(a){ if(!a.tasks.length) return 0; return a.tasks.filter(t=>t.done).length / a.tasks.length; }
function findTask(areaId,taskId){ const a=S.areas.find(x=>x.id===areaId); if(!a) return null; const tk=a.tasks.find(x=>x.id===taskId); return tk?{area:a,task:tk}:null; }
function getTask(areaId,taskId){
  if(LISTS[areaId]){ const tk=listArr(areaId).find(x=>x.id===taskId); return tk?{area:{id:areaId,name:LISTS[areaId].name,emoji:LISTS[areaId].emoji},task:tk}:null; }
  return findTask(areaId,taskId);
}

/* pick next task to focus */
function pickTask(preferQuick){
  let pool;
  if(!focusScope || focusScope==='five'){
    // Focus defaults to Today's Five, in the order they're listed
    const left = fiveTasks().filter(x=>!x.task.done);
    const fresh5 = left.filter(x=>!skipped.includes(x.task.id));
    if(!left.length) return null;
    if(!fresh5.length){ skipped=[]; return left[0]; }
    if(preferQuick){ const q=fresh5.filter(x=>x.task.min<=5); if(q.length) return q[0]; }
    return fresh5[0];
  } else if(LISTS[focusScope]){
    const cfg=LISTS[focusScope];
    pool = listArr(focusScope).filter(tk=>!tk.done).map(tk=>({area:{id:focusScope,name:cfg.name,emoji:cfg.emoji},task:tk}));
  } else {
    pool = allTasks().filter(x=>!x.task.done);
    if(focusScope!=='any') pool = pool.filter(x=>x.area.id===focusScope);
  }
  if(!pool.length) return null;
  let fresh = pool.filter(x=>!skipped.includes(x.task.id));
  if(!fresh.length){ skipped=[]; fresh=pool; }
  if(preferQuick){
    const quick = fresh.filter(x=>x.task.min<=5);
    if(quick.length) fresh=quick;
  }
  fresh.sort((a,b)=>a.task.min-b.task.min);
  // a touch of variety: pick among the 3 quickest
  const top = fresh.slice(0,3);
  return top[Math.floor(Math.random()*top.length)];
}

function pruneHistory(){
  if(!S.history) return;
  Object.keys(S.history).forEach(k=>{ const d=daysSince(k); if(d==null||d>70) delete S.history[k]; });
}
function buildRecap(weekKey){
  const start=parseKey(weekKey); if(isNaN(start)) return;
  const names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  let total=0, best=null, bestN=0, active=0;
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const k=keyOf(d), n=(S.history&&S.history[k])||0;
    total+=n;
    if(n>bestN){ bestN=n; best=names[d.getDay()]; }
    if(n>0 || isActive(k)) active++;
  }
  const inWeek=k=>{ if(!k) return false; const d=parseKey(k); return d>=start && (d-start)<7*86400000; };
  const routines=LIST_ORDER.filter(s=>inWeek(S[LISTS[s].lastField])).map(s=>LISTS[s].emoji+' '+LISTS[s].name);
  const rooms=S.areas.map(a=>({emoji:a.emoji, name:a.name, done:a.tasks.filter(t=>t.done).length, total:a.tasks.length}));
  if(!total && !active) return;   // nothing to celebrate, skip quietly
  S.recap={ week:weekKey, total, best, bestN, active, routines, rooms, seen:false };
}

function routineCardHTML(scope){
  const cfg=LISTS[scope], arr=listArr(scope);
  const total=arr.length, done=arr.filter(t=>t.done).length;
  const allDone = total>0 && done===total;
  const inProgress = done>0 && !allDone;
  const pct = total?Math.round(done/total*100):0;
  const hot = !allDone && routineHot(scope);
  const since = daysSince(S[cfg.lastField]);
  const sinceTxt = since==null?null:(since===0?'today':since+(since===1?' day':' days')+' ago');
  const isSun = new Date().getDay()===0;

  let badge, sub, cta;
  if(allDone){
    badge='Done this '+cfg.unit;
    sub = scope==='reset' ? 'Clean slate locked in for the week.' : 'The big jobs are handled — genuinely fresh.';
    cta='Review';
  } else if(inProgress){
    badge=cfg.name; sub=`${done} of ${total} done — chip away anytime.`; cta='Continue';
  } else {
    badge = (scope==='reset' && isSun) ? 'It’s Sunday' : cfg.name;
    sub = (scope==='reset' && isSun) ? 'A short reset now sets up the whole week.'
        : (sinceTxt ? `Last done ${sinceTxt}.` : 'Tap in whenever it feels right.');
    cta='Start';
  }

  return `<div class="routinecard ${hot?'hot':''} ${allDone?'done':''}" style="--accent:${cfg.accent};--accent-soft:${cfg.soft};--accent-bg:${cfg.bg};--accent-lite:${cfg.lite}">

}

function renderDeepGroup(){
  const el=document.getElementById('deepGroup'); if(!el) return;
  const scopes=['deep','quarter','half'];
  const info=scopes.map(s=>{ const arr=listArr(s), total=arr.length, done=arr.filter(t=>t.done).length;
    return {s, allDone: total>0&&done===total, inProgress: done>0&&done<total, hot: routineHot(s)}; });
  const progCount=info.filter(i=>i.inProgress).length;
  const hotCount=info.filter(i=>!i.allDone && i.hot).length;
  const doneCount=info.filter(i=>i.allDone).length;
  const open=!!S._deepGroupOpen;

  let chip, chipHot=false;
  if(progCount){ chip=progCount+' in progress'; }
  else if(hotCount){ chip=hotCount+' due soon'; chipHot=true; }
  else if(doneCount===3){ chip='all done ✓'; }
  else { chip='nothing due'; }

  // when collapsed, surface only the one that needs attention
  let featured=null;
  if(!open){
    const prog=info.find(i=>i.inProgress);
    const hot=info.find(i=>!i.allDone && i.hot);
    featured = prog ? prog.s : (hot ? hot.s : null);
  }

  let body;
  if(open){
    body = scopes.map(routineCardHTML).join('') + `<button class="dg-more" onclick="toggleDeepGroup()">▴ Collapse deep cleans</button>`;
  } else if(featured){
    body = routineCardHTML(featured) + `<button class="dg-more" onclick="toggleDeepGroup()">＋ 2 more deep cleans</button>`;
  } else {
    body = `<button class="dg-more" onclick="toggleDeepGroup()">View all 3 deep cleans →</button>`;
  }

  el.innerHTML = `<div class="deepgroup ${open?'open':''}">
    <button class="deepgroup-head spaced" onclick="toggleDeepGroup()">
      <span class="dg-title">🧹 Deep Cleans</span>
      <span class="dg-right"><span class="dg-chip ${chipHot?'hot':''}">${chip}</span><span class="dg-chev">${open?'▾':'▸'}</span></span>
    </button>

  </div>`;
}

  if(!currentTask || !getTask(currentTask.areaId,currentTask.taskId) || getTask(currentTask.areaId,currentTask.taskId).task.done){
    const picked=pickTask(false);
    currentTask = picked ? {areaId:picked.area.id, taskId:picked.task.id} : null;
    if(currentTask){ const tk=getTask(currentTask.areaId,currentTask.taskId).task; setTimer(tk.min); }
  }

  if(!currentTask){
    const cfg=LISTS[focusScope];
    let em='🌿', head='You did it', body='Every room task is handled for the week. That is a genuinely good week.';
    let btns='';
    const roomsLeft=allTasks().filter(x=>!x.task.done).length;
    if(!focusScope || focusScope==='five'){
      if(roomsLeft){
        em='🎲'; head='Today\'s Five: done';
        body='That is a properly good day. Stop here guilt-free — or keep the momentum going.';
        btns=`<button class="btn-done" onclick="rollFive(false)">🎲 Give me 5 more</button>
              <button class="btn-minor" onclick="focusAny()">Keep going, one at a time</button>`;
      }
    } else if(cfg){
      em=cfg.emoji;
      if(focusScope==='reset'){ head='Reset complete'; body='The week is set up to feel calm — enjoy the fresh start.'; }
      else { head=cfg.name+' done'; body='The big jobs are handled — your place is genuinely fresh, no small thing.'; }
      btns=`<button class="btn-minor" onclick="clearScope()">Back to Today's Five</button>`;
    } else if(focusScope!=='any'){
      head='This area is done'; body='Nice work clearing this space for the week.';
      btns=`<button class="btn-minor" onclick="clearScope()">Back to Today's Five</button>`;
    } else if(roomsLeft===0){
      btns=`<button class="btn-minor" onclick="clearScope()">Back to Today's Five</button>`;
    }
    fv.innerHTML = `<div class="alldone">
      <div class="em">${em}</div>
      <h2>${head}</h2>
      <p>${body}</p>
      ${btns?`<div class="actions" style="margin-top:18px">${btns}</div>`:''}
    </div>`;
    return;
  }

  const {area,task}=getTask(currentTask.areaId,currentTask.taskId);
  const micros = microState[task.id]||[];
  fv.innerHTML = `
    <div class="focuscard">
      <div class="areachip">${area.emoji} ${area.name}</div>
      <h2 class="task-title">${escapeHtml(task.name)}</h2>
      <div class="task-est">Roughly <b class="est-edit" onclick="editMin('${area.id}','${task.id}')" title="Edit time">${task.min} min</b> — but stopping early still counts.</div>

      <div class="timerwrap">
        <svg width="172" height="172" viewBox="0 0 172 172">
          <circle cx="86" cy="86" r="76" fill="none" stroke="var(--bg2)" stroke-width="10"/>
          <circle id="tRing" cx="86" cy="86" r="76" fill="none" stroke="var(--coral)" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="477.5" stroke-dashoffset="0"
            transform="rotate(-90 86 86)" style="transition:stroke-dashoffset 1s linear;"/>
        </svg>
        <div class="time"><div class="t" id="tDisplay">${fmt(timerLeft)}</div><div class="state" id="tState">ready</div></div>
      </div>

      <div class="presets" id="presets">
        ${[5,10,15,20,25].map(m=>`<button class="preset ${m===Math.round(timerTotal/60)?'on':''}" onclick="setTimer(${m})">${m}m</button>`).join('')}
      </div>
      <div class="timerbtns">
        <button class="tbtn" id="tToggle" onclick="toggleTimer()">▶ Start</button>
        <button class="tbtn" onclick="resetTimer()">↺ Reset</button>
      </div>

      <div class="actions">
        <button class="btn-done" onclick="completeTask()">✓ Done with this</button>
        <div class="minor-row">
          <button class="btn-minor" onclick="nextTask(false)">Skip for now</button>
          <button class="btn-minor" onclick="nextTask(true)">Something quicker</button>
        </div>
        <button class="btn-minor" onclick="toggleBreakdown()" style="border-style:dashed">${breakdownOpen?'Hide steps':'Feels too big? Break it down'}</button>
      </div>

      ${breakdownOpen?renderBreakdown(task,micros):''}

      ${LISTS[focusScope]?`<button class="btn-minor" onclick="finishList('${focusScope}')" style="margin-top:10px">✓ Mark whole ${LISTS[focusScope].name} finished</button>`:''}

      <p class="scope-note">${(!focusScope||focusScope==='five')?`<b>🎲 Today's Five</b> · ${fiveTasks().filter(x=>x.task.done).length} of ${fiveTasks().length} done. <button onclick="focusAny()">Pick from all rooms</button>`:(LISTS[focusScope]?`<b>${LISTS[focusScope].emoji} ${LISTS[focusScope].name}</b> in progress. <button onclick="clearScope()">Back to Today's Five</button>`:(focusScope==='any'?`Pulling from every room. <button onclick="clearScope()">Back to Today's Five</button>`:`Focusing on <b>${area.name}</b>. <button onclick="clearScope()">Back to Today's Five</button>`))}</p>
    </div>`;
  updateTimerUI();
}

function renderBreakdown(task,micros){
  const steps = microSteps(task.name);
  return `<div class="breakdown">
    <h4>Tiny version — just start here</h4>
    ${steps.map((s,i)=>`<div class="micro ${micros[i]?'checked':''}" onclick="toggleMicro('${task.id}',${i},${steps.length})">
      <div class="box"></div><span>${escapeHtml(s)}</span></div>`).join('')}
  </div>`;
}
/* generic micro-steps that reduce a task to a 2-minute on-ramp */
function microSteps(name){
  return [
    'Set a 2-minute timer — that\'s the whole commitment',
    'Clear just the nearest spot or single item',
    'Keep going only if it feels okay',
    'Stop whenever — partial counts'
  ];
}

/* ============ ACTIONS ============ */
function setMode(m){
  mode=m;
  document.getElementById('focusView').classList.toggle('hidden', m!=='focus');
  document.getElementById('overviewView').classList.toggle('hidden', m!=='overview');
  document.getElementById('mFocus').classList.toggle('active', m==='focus');
  document.getElementById('mOverview').classList.toggle('active', m==='overview');
  document.getElementById('glider').style.transform = m==='focus'?'translateX(0)':'translateX(100%)';
  render();
}
function toggleArea(id){ const a=S.areas.find(x=>x.id===id); a._open=!a._open; renderOverview(); }
function bump(n){
  S.todayCount=Math.max(0,(S.todayCount||0)+n);
  if(!S.history) S.history={};
  const k=todayStr(); S.history[k]=Math.max(0,(S.history[k]||0)+n);
}

function editMin(scopeOrArea,taskId){
  const f=getTask(scopeOrArea,taskId); if(!f) return;
  const v=prompt(`How many minutes for "${f.task.name}"?`, f.task.min);
  if(v===null) return;
  const n=Math.round(parseFloat(v));
  if(!isFinite(n)||n<1){ toast('Enter a number of minutes, 1 or more.','⏱️'); return; }
  f.task.min=Math.min(n,240);
  if(currentTask && currentTask.taskId===taskId) setTimer(f.task.min);
  save(); render();
}

function toggleListEdit(scope){ const k='_open_'+scope; S[k]=!S[k]; renderOverview(); }
function toggleListDone(scope,taskId){
  const arr=listArr(scope), cfg=LISTS[scope];
  const tk=arr.find(x=>x.id===taskId); if(!tk) return;
  const was=tk.done; tk.done=!tk.done;
  if(!was&&tk.done){ awardPoints(15); bump(1); registerActiveDay();
    if(arr.every(t=>t.done)&&S[cfg.lastField]!==todayStr()){ S[cfg.lastField]=todayStr(); awardPoints(cfg.bonus); fireConfetti(); toast(cfg.name+' complete! ✨','🌟'); } }
  else if(was&&!tk.done){ S.points=Math.max(0,S.points-15); bump(-1); if(S[cfg.lastField]===todayStr()) S[cfg.lastField]=null; }
  save(); render();
}
function delList(scope,taskId){ const arr=listArr(scope); const i=arr.findIndex(x=>x.id===taskId); if(i>=0) arr.splice(i,1); save(); renderOverview(); renderRoutines(); }
function addList(scope){ const inp=document.getElementById('add_'+scope); const v=inp.value.trim(); if(!v) return; listArr(scope).push(t(v,LISTS[scope].addMin)); inp.value=''; S['_open_'+scope]=true; save(); renderOverview(); renderRoutines(); setTimeout(()=>{const ni=document.getElementById('add_'+scope); if(ni)ni.focus();},50); }

function finishArea(id){
  const a=S.areas.find(x=>x.id===id); if(!a) return;
  a.tasks.forEach(tk=>{ if(!tk.done){ tk.done=true; stampDone(tk); awardPoints(10); bump(1); } });
  registerActiveDay(); fireConfetti(); toast(a.name+' — all set! ✨','🌟');
  save(); render();
}

/* remember when each task was last done (drives Smarter Five) */
function stampDone(tk){ if(tk.lastDone!==todayStr()){ tk.prevDone=tk.lastDone||null; tk.lastDone=todayStr(); } }
function unstampDone(tk){ if(tk.lastDone===todayStr()){ tk.lastDone=tk.prevDone||null; } }
function toggleDaily(areaId,taskId){
  const f=findTask(areaId,taskId); if(!f) return;
  f.task.daily=!f.task.daily;
  toast(f.task.daily?'Resets every morning now ☀️':'Back to weekly — resets Mondays','🔁');
  save(); renderOverview();
}

/* ---- Backup & restore ---- */
function backupPayload(){
  const copy=JSON.parse(JSON.stringify(S));
  return JSON.stringify({app:'CleanFlow', version:1, savedAt:new Date().toISOString(), state:copy}, null, 1);
}
async function exportBackup(){
  S.lastBackup=todayStr(); save();
  const name='cleanflow-backup-'+todayStr()+'.json';
  const text=backupPayload();
  try{
    const file=new File([text], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'CleanFlow backup'});
      toast('Backup ready — save it to Files or iCloud Drive 📁','💾'); renderOverview(); return;
    }
  }catch(e){ if(e && e.name==='AbortError'){ return; } }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('Backup downloaded 💾','💾');
  }catch(e){
    try{ await navigator.clipboard.writeText(text); toast('Backup copied to clipboard — paste it into a note','📋'); }
    catch(e2){ toast('Could not save a backup on this device','⚠️'); }
  }
  renderOverview();
}
function importBackup(input){
  const file=input.files && input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ()=>{
    input.value='';
    let data;
    try{ data=JSON.parse(reader.result); }catch(e){ toast('That file isn\'t a CleanFlow backup','⚠️'); return; }
    const st=data && data.state;
    if(!data || data.app!=='CleanFlow' || !st || !Array.isArray(st.areas)){ toast('That file isn\'t a CleanFlow backup','⚠️'); return; }
    const when=data.savedAt?new Date(data.savedAt).toLocaleDateString():'an unknown date';
    if(!confirm('Restore the backup from '+when+'? This replaces everything currently in CleanFlow on this phone.')) return;
    await Store.set(st);
    focusScope=null; currentTask=null; skipped=[];
    await init();
    toast('Backup restored ✨','✅');
  };
  reader.readAsText(file);
}

function focusArea(id){ focusScope=id; currentTask=null; skipped=[]; setMode('focus'); }
function clearScope(){ focusScope=null; currentTask=null; skipped=[]; breakdownOpen=false; render(); }
function focusAny(){ focusScope='any'; currentTask=null; skipped=[]; breakdownOpen=false; setMode('focus'); }

function toggleTaskDone(areaId,taskId){
  const f=findTask(areaId,taskId); if(!f) return;
  const was=f.task.done;
  f.task.done=!f.task.done;
  if(!was && f.task.done){ stampDone(f.task); awardPoints(10); bump(1); registerActiveDay(); }
  else if(was && !f.task.done){ unstampDone(f.task); S.points=Math.max(0,S.points-10); bump(-1); }
  save(); render();
}
function delTask(areaId,taskId){ const a=S.areas.find(x=>x.id===areaId); a.tasks=a.tasks.filter(t=>t.id!==taskId); save(); renderOverview(); renderHeader(); }
function addTask(areaId){
  const inp=document.getElementById('add_'+areaId); const v=inp.value.trim(); if(!v) return;
  const a=S.areas.find(x=>x.id===areaId); a.tasks.push(t(v,5)); inp.value=''; a._open=true;
  save(); renderOverview(); renderHeader();
  setTimeout(()=>{ const ni=document.getElementById('add_'+areaId); if(ni) ni.focus(); },50);
}
function addArea(){
  const name=prompt('Name this area (e.g. Laundry, Balcony):'); if(!name) return;
  const emoji=prompt('Pick an emoji for it (optional):','🧺')||'📦';
  S.areas.push({id:'a'+Date.now(), name:name.trim(), emoji:emoji.trim()||'📦', tasks:[], _open:true});
  save(); renderOverview();
}
function renameArea(id){ const a=S.areas.find(x=>x.id===id); const n=prompt('Rename area:',a.name); if(n){ a.name=n.trim(); save(); renderOverview(); } }
function delArea(id){ if(!confirm('Delete this area and its tasks?')) return; S.areas=S.areas.filter(a=>a.id!==id); if(focusScope===id) focusScope=null; save(); renderOverview(); renderHeader(); }

function completeTask(){
  if(!currentTask) return;
  const f=getTask(currentTask.areaId,currentTask.taskId); if(!f) return;
  f.task.done=true;
  stampDone(f.task);
  awardPoints(15);
  bump(1);
  registerActiveDay();
  fireConfetti();
  const cfg=LISTS[focusScope];
  if(cfg && listArr(focusScope).every(tk=>tk.done) && S[cfg.lastField]!==todayStr()){
    S[cfg.lastField]=todayStr();
    awardPoints(cfg.bonus);
    setTimeout(()=>toast(cfg.name+' complete — nicely done! ✨','🌟'),900);
  } else {
    toast(pickPraise(), '🎉');
  }
  pauseTimer();
  delete microState[f.task.id];
  breakdownOpen=false;
  currentTask=null;
  save();
  render();
}
function nextTask(quick){
  if(currentTask) skipped.push(currentTask.taskId);
  const picked=pickTask(quick);
  currentTask = picked?{areaId:picked.area.id, taskId:picked.task.id}:null;
  breakdownOpen=false;
  if(currentTask){ const tk=getTask(currentTask.areaId,currentTask.taskId).task; setTimer(tk.min); }
  renderFocus();
}
function toggleBreakdown(){ breakdownOpen=!breakdownOpen; renderFocus(); }
function toggleMicro(taskId,i,len){
  if(!microState[taskId]) microState[taskId]=new Array(len).fill(false);
  microState[taskId][i]=!microState[taskId][i];
  renderFocus();
}

/* points + streak */
function awardPoints(n){ S.points+=n; }
function dayKeyOffset(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function isActive(key){ return (S.activeDays||[]).indexOf(key)>=0; }
function computeStreak(){
  const days=S.activeDays||[];
  if(!days.length) return 0;
  // count back from today, or from yesterday if today isn't logged yet
  let start = isActive(dayKeyOffset(0)) ? 0 : (isActive(dayKeyOffset(1)) ? 1 : -1);
  if(start<0) return 0;
  let n=0, i=start;
  while(isActive(dayKeyOffset(i))){ n++; i++; }
  return n;
}
function refreshStreak(){ S.streak=computeStreak(); }
function registerActiveDay(){
  const today=todayStr();
  if(!S.activeDays) S.activeDays=[];
  if(isActive(today)) return;
  S.activeDays.push(today);
  const before=S.streak||0;
  refreshStreak();
  if(S.streak>1 && S.streak>before) setTimeout(()=>toast(S.streak+'-day streak! 🌱 Growing.','🔥'),900);
}
function toggleActiveDay(key){
  if(!S.activeDays) S.activeDays=[];
  const i=S.activeDays.indexOf(key);
  if(i>=0) S.activeDays.splice(i,1); else S.activeDays.push(key);
  const before=S.streak||0;
  refreshStreak();
  save();
  renderHeader(); renderBackfill();
  if(S.streak>before) toast(S.streak+'-day streak restored 🌱','✨');
}
function toggleBackfill(){ backfillOpen=!backfillOpen; renderBackfill(); }
function renderBackfill(){
  const el=document.getElementById('backfillPanel'); if(!el) return;
  if(!backfillOpen){ el.innerHTML=''; return; }
  const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let rows='';
  for(let i=0;i<14;i++){
    const key=dayKeyOffset(i);
    const d=new Date(); d.setDate(d.getDate()-i);
    const label = i===0?'Today':(i===1?'Yesterday':names[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate());
    const on=isActive(key);
    rows += `<div class="bf-row ${on?'on':''}" onclick="toggleActiveDay('${key}')">
      <div class="box"></div><span>${label}</span>${on?'<em>logged</em>':''}</div>`;
  }
  el.innerHTML=`<div class="backfill">
    <h4>Did you clean on a day you forgot to log?</h4>
    <p class="bf-note">Tap any day you actually did something. This is just your own honest record — it keeps your streak accurate.</p>
    ${rows}
    <button class="bf-close" onclick="toggleBackfill()">Done</button>
  </div>`;
}

/* ============ TIMER ============ */
function setTimer(min){
  timerTotal=min*60; timerLeft=timerTotal; pauseTimer(); updateTimerUI();
  // refresh preset highlight if visible
  const ps=document.getElementById('presets');
  if(ps) ps.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on', b.textContent===min+'m'));
}
function toggleTimer(){ timerRunning?pauseTimer():startTimer(); }
function startTimer(){
  if(timerLeft<=0) timerLeft=timerTotal;
  timerRunning=true;
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    timerLeft--;
    if(timerLeft<=0){ timerLeft=0; pauseTimer(); chime(); toast('Time! Stop here or keep going — your call.','⏰'); }
    updateTimerUI();
  },1000);
  updateTimerUI();
}
function pauseTimer(){ timerRunning=false; clearInterval(timerInt); updateTimerUI(); }
function resetTimer(){ timerLeft=timerTotal; pauseTimer(); updateTimerUI(); }
function updateTimerUI(){
  const d=document.getElementById('tDisplay'); if(d) d.textContent=fmt(timerLeft);
  const st=document.getElementById('tState'); if(st) st.textContent=timerRunning?'focusing':(timerLeft===0?'time up':'ready');
  const tg=document.getElementById('tToggle'); if(tg) tg.textContent=timerRunning?'⏸ Pause':'▶ Start';
  const ring=document.getElementById('tRing');
  if(ring){ const c=477.5; const frac=timerTotal?timerLeft/timerTotal:0; ring.style.strokeDashoffset=c-c*frac; }
}
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }

function chime(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [880,1175].forEach((f,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=f; o.type='sine'; o.connect(g); g.connect(ctx.destination); const t0=ctx.currentTime+i*0.18; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.25,t0+.03); g.gain.exponentialRampToValueAtTime(.001,t0+.4); o.start(t0); o.stop(t0+.42); });
  }catch(e){}
}

/* ============ TOAST + CONFETTI ============ */
let toastTimer=null;
function toast(msg,em){
  const el=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  el.querySelector('.em').textContent=em||'🎉';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}
const praises=['Nailed it.','That\'s one less thing.','Look at you go.','Momentum unlocked.','Done and dusted.','Tiny win, real progress.','Space feels lighter already.'];
function pickPraise(){ return praises[Math.floor(Math.random()*praises.length)]; }

function fireConfetti(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.getElementById('confetti'); const ctx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#45795B','#6BA888','#EE8C53','#E0A93F','#DBEADF'];
  const N=90, parts=[];
  for(let i=0;i<N;i++){ parts.push({x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*0.32, vx:(Math.random()-.5)*9, vy:Math.random()*-11-4, g:.35+Math.random()*.2, s:5+Math.random()*6, c:cols[i%cols.length], rot:Math.random()*6, vr:(Math.random()-.5)*.4, life:0}); }
  let frame=0;
  (function anim(){
    ctx.clearRect(0,0,cv.width,cv.height); frame++;
    parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-frame/90); ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); });
    if(frame<90) requestAnimationFrame(anim); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

window.addEventListener('resize',()=>{ const cv=document.getElementById('confetti'); cv.width=innerWidth; cv.height=innerHeight; });

init();
